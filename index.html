<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperChat</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #313338; color: white; }
        
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .auth-box { background: #2b2d31; padding: 40px; border-radius: 8px; text-align: center; width: 90%; max-width: 350px; }
        .auth-input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #1e1f22; color: white; }
        .auth-btn { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #5865F2; color: white; cursor: pointer; font-weight: bold; }
        .google-btn { background: white; color: black; }

        #app-container { display: none; height: 100vh; display: flex; }
        
        #sidebar { width: 250px; background: #2b2d31; color: white; padding: 20px; display: flex; flex-direction: column; }
        #brand { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #1e1f22; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        #logout-btn { background: #da373c; padding: 5px 10px; border-radius: 4px; border: none; color: white; cursor: pointer; font-size: 0.8em; }
        
        .channel-link { color: #949ba4; padding: 5px; border-radius: 4px; cursor: pointer; margin-bottom: 5px; }
        .channel-link:hover { background: #3f4147; color: white; }
        .active-chat-link { background: #3f4147; color: white; }

        .friend-item { display: flex; justify-content: space-between; align-items: center; background: #1e1f22; padding: 8px; margin-bottom: 5px; border-radius: 4px; font-size: 0.9em; cursor: pointer; }
        .friend-item:hover { background: #383a40; }
        .friend-call-btn { background: #23a559; border: none; color: white; border-radius: 3px; cursor: pointer; padding: 4px 8px; font-size: 0.8em; }

        #main-chat { flex-grow: 1; display: flex; flex-direction: column; background: #313338; color: white; overflow: hidden; position: relative; }
        
        #call-status-bar { background: #1e1f22; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b2d31; font-size: 0.9em; }
        #hangup-btn { background: #da373c; padding: 5px 15px; border-radius: 4px; border: none; color: white; cursor: pointer; font-weight: bold; display: none; }

        #chat-header { padding: 15px 20px; border-bottom: 1px solid #2b2d31; font-weight: bold; font-size: 1.1em; }
        
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-block { display: flex; flex-direction: column; }
        .message-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
        .sender-name { font-weight: bold; font-size: 0.9em; color: #5865F2; }
        .message-time { font-size: 0.75em; color: #949ba4; }
        .chat-media-img { max-width: 250px; max-height: 250px; border-radius: 8px; margin-top: 5px; }

        #input-area { padding: 20px; background: #2b2d31; display: flex; gap: 10px; align-items: center; position: relative; }
        #message-input { flex-grow: 1; padding: 10px; border-radius: 5px; border: none; background: #383a40; color: white; }
        .action-btn { background: #383a40; border: none; color: white; border-radius: 5px; padding: 10px 12px; cursor: pointer; font-weight: bold; }
        .action-btn:hover { background: #4e5058; }
        #send-btn { padding: 10px 20px; border-radius: 5px; border: none; background: #5865F2; color: white; cursor: pointer; font-weight: bold; }

        /* Popups for Emoji and GIF Pickers */
        .picker-popup { display: none; position: absolute; bottom: 70px; right: 20px; background: #2b2d31; border: 1px solid #383a40; border-radius: 8px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #gif-picker-popup { width: 300px; padding: 10px; }
        #gif-search-input { width: 100%; padding: 8px; border-radius: 4px; border: none; background: #1e1f22; color: white; margin-bottom: 10px; }
        #gif-results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; }
        #gif-results img { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; cursor: pointer; }
        #gif-results img:hover { opacity: 0.8; }

        @media (max-width: 768px) {
            #app-container { flex-direction: column; }
            #sidebar { width: 100%; height: auto; max-height: 40vh; overflow-y: auto; border-bottom: 2px solid #1e1f22; }
            #main-chat { height: 60vh; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>HyperChat</h2>
            <input type="email" id="email" class="auth-input" placeholder="Email">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <button id="email-login-btn" class="auth-btn">Log In / Sign Up</button>
            <p>or</p>
            <button id="google-login-btn" class="auth-btn google-btn">Sign in with Google</button>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <div>
                <div id="brand">HyperChat <button id="logout-btn">Logout</button></div>
                <h3>Channels</h3>
                <div id="general-channel-btn" class="channel-link active-chat-link"># general</div>
            </div>
            
            <div style="margin-top: 15px; border-top: 1px solid #1e1f22; padding-top: 15px;">
                <h3 style="margin-top: 0;">Direct Messages</h3>
                <div id="friends-list" style="margin-bottom: 10px; max-height: 150px; overflow-y: auto;"></div>
                
                <div style="display: flex; gap: 5px; flex-direction: column;">
                    <input type="text" id="friend-name-input" placeholder="Friend's Name" style="padding: 6px; border-radius: 3px; border: none; background: #1e1f22; color: white;">
                    <input type="text" id="friend-id-input" placeholder="Their Voice ID" style="padding: 6px; border-radius: 3px; border: none; background: #1e1f22; color: white;">
                    <button id="add-friend-btn" style="background: #2b2d31; border: 1px solid #5865F2; color: #5865F2; border-radius: 3px; cursor: pointer; padding: 6px;">+ Add Friend</button>
                </div>
            </div>

            <div id="user-profile" style="margin-top: auto; border-top: 1px solid #1e1f22; padding-top: 15px;">
                <div style="font-size: 0.8em; color: #949ba4; margin-bottom: 5px;">LOGGED IN AS</div>
                <div id="current-username" style="font-weight: bold; margin-bottom: 10px; color: white;">Loading...</div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="username-input" placeholder="New name..." style="width: 100%; padding: 5px; border-radius: 3px; border: none; background: #1e1f22; color: white;">
                    <button id="save-username-btn" style="background: #5865F2; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 5px 10px;">Save</button>
                </div>
            </div>
        </div>

        <div id="main-chat">
            
            <div id="call-status-bar">
                <span id="call-status-text" style="color: #949ba4;">Your Voice ID: <b id="my-peer-id" style="color: white;">Loading...</b></span>
                <button id="hangup-btn">Hang Up</button>
                <audio id="remote-audio" autoplay></audio>
            </div>

            <div id="chat-header"># general</div>

            <div id="emoji-picker-popup" class="picker-popup">
                <emoji-picker class="dark"></emoji-picker>
            </div>

            <div id="gif-picker-popup" class="picker-popup">
                <input type="text" id="gif-search-input" placeholder="Search GIFs...">
                <div id="gif-results"></div>
            </div>

            <div id="messages"></div>
            
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Send a message..." disabled>
                
                <button id="emoji-btn" class="action-btn" title="Add Emoji">😀</button>
                <button id="gif-btn" class="action-btn" title="Send GIF">GIF</button>
                
                <!-- Hidden file input triggered by paperclip button -->
                <input type="file" id="file-input" style="display: none;">
                <button id="file-btn" class="action-btn" title="Upload File or Image">📎</button>

                <button id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
