<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HyperChat</title>
    
    <!-- Import PeerJS for Voice Calling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- THE DESIGN (CSS) -->
    <style>
        body { margin: 0; font-family: sans-serif; background: #313338; color: white; }
        
        /* Login Screen */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .auth-box { background: #2b2d31; padding: 40px; border-radius: 8px; text-align: center; width: 300px; }
        .auth-input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #1e1f22; color: white; }
        .auth-btn { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #5865F2; color: white; cursor: pointer; font-weight: bold; }
        .google-btn { background: white; color: black; }

        /* App Layout */
        #app-container { display: none; height: 100vh; }
        #sidebar { width: 200px; background: #2b2d31; color: white; padding: 20px; }
        #brand { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #1e1f22; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        #logout-btn { background: #da373c; padding: 5px 10px; border-radius: 4px; border: none; color: white; cursor: pointer; font-size: 0.8em; }
        
        #main-chat { flex-grow: 1; display: flex; flex-direction: column; background: #313338; color: white; }
        
        /* Voice Panel */
        #voice-panel { background: #1e1f22; padding: 15px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #2b2d31; }
        .voice-input { padding: 8px; border-radius: 4px; border: none; background: #383a40; color: white; }
        .call-btn { padding: 8px 15px; border-radius: 4px; border: none; background: #23a559; color: white; cursor: pointer; font-weight: bold; }
        .hangup-btn { padding: 8px 15px; border-radius: 4px; border: none; background: #da373c; color: white; cursor: pointer; font-weight: bold; display: none; }
        
        /* Text Chat */
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-block { display: flex; flex-direction: column; }
        .sender-name { font-weight: bold; font-size: 0.9em; color: #5865F2; margin-bottom: 2px; }
        #input-area { padding: 20px; background: #2b2d31; display: flex; gap: 10px; }
        #message-input { flex-grow: 1; padding: 10px; border-radius: 5px; border: none; background: #383a40; color: white; }
        #send-btn { padding: 10px 20px; border-radius: 5px; border: none; background: #5865F2; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>Welcome to HyperChat</h2>
            <input type="email" id="email" class="auth-input" placeholder="Email">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <button id="email-login-btn" class="auth-btn">Log In / Sign Up</button>
            <p>or</p>
            <button id="google-login-btn" class="auth-btn google-btn">Sign in with Google</button>
        </div>
    </div>

    <!-- 2. CHAT APP SCREEN -->
    <div id="app-container">
        <div id="sidebar">
            <div id="brand">HyperChat <button id="logout-btn">Logout</button></div>
            <h3>Channels</h3>
            <p style="color: white; background: #3f4147; padding: 5px; border-radius: 4px;"># general</p>
            <p style="color: #949ba4;">🔊 voice</p>
        </div>

        <div id="main-chat">
            
            <!-- VOICE PANEL -->
            <div id="voice-panel">
                <span style="font-size: 0.9em; color: #949ba4;">Your Voice ID: <b id="my-peer-id" style="color: white;">Loading...</b></span>
                <div style="flex-grow: 1;"></div>
                <input type="text" id="target-peer-id" class="voice-input" placeholder="Paste friend's ID to call">
                <button id="call-btn" class="call-btn">Call</button>
                <button id="hangup-btn" class="hangup-btn">Hang Up</button>
                <audio id="remote-audio" autoplay></audio>
            </div>

            <!-- TEXT CHAT -->
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Message #general" disabled>
                <button id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- 3. FIREBASE & PEERJS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ==========================================
        // PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {

        apiKey: "AIzaSyAPAEbgizA_47jWEQBx6d4720PLzuvOPbk",

        authDomain: "hyperchat-c8eaa.firebaseapp.com",

        databaseURL: "https://hyperchat-c8eaa-default-rtdb.firebaseio.com",

        projectId: "hyperchat-c8eaa",

        storageBucket: "hyperchat-c8eaa.firebasestorage.app",

        messagingSenderId: "379852906414",

        appId: "1:379852906414:web:d96f83e19d2d7ee304f23f"

        };

        // ==========================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app); 
        let currentUser = null;

        // --- VOICE CALLING LOGIC (PeerJS) ---
        let peer = null;
        let currentCall = null;
        let localAudioStream = null;

        function initVoiceChat() {
            peer = new Peer(); 
            
            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
            });

            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ video: false, audio: true })
                    .then((stream) => {
                        localAudioStream = stream;
                        call.answer(stream);
                        setupCallUI(call);
                    })
                    .catch((err) => alert("Microphone access denied."));
            });
        }

        function setupCallUI(call) {
            currentCall = call;
            document.getElementById('call-btn').style.display = 'none';
            document.getElementById('hangup-btn').style.display = 'inline-block';

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-audio').srcObject = remoteStream;
            });

            call.on('close', resetCallUI);
        }

        function resetCallUI() {
            document.getElementById('call-btn').style.display = 'inline-block';
            document.getElementById('hangup-btn').style.display = 'none';
            
            if (currentCall) currentCall.close();
            if (localAudioStream) {
                localAudioStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('remote-audio').srcObject = null;
        }

        document.getElementById('call-btn').addEventListener('click', () => {
            const targetId = document.getElementById('target-peer-id').value.trim();
            if (!targetId) return alert("Please enter an ID to call.");

            navigator.mediaDevices.getUserMedia({ video: false, audio: true })
                .then((stream) => {
                    localAudioStream = stream;
                    const call = peer.call(targetId, stream);
                    setupCallUI(call);
                })
                .catch((err) => alert("Microphone access denied."));
        });

        document.getElementById('hangup-btn').addEventListener('click', resetCallUI);


        // --- AUTHENTICATION & DATABASE LOGIC ---
        const authScreen = document.getElementById('auth-screen');
        const appContainer = document.getElementById('app-container');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatRef = ref(db, 'channels/general');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                
                if(!peer) initVoiceChat(); 
            } else {
                currentUser = null;
                authScreen.style.display = 'flex';
                appContainer.style.display = 'none';
            }
        });

        document.getElementById('google-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert(err.message));
        });

        document.getElementById('email-login-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((err) => {
                    if(err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                        createUserWithEmailAndPassword(auth, email, password).catch(e => alert(e.message));
                    } else alert(err.message);
                });
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text && currentUser) {
                const displayName = currentUser.displayName || currentUser.email.split('@')[0];
                push(chatRef, { name: displayName, text: text, timestamp: Date.now() });
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-block';
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'sender-name';
            nameSpan.innerText = data.name;
            
            const textSpan = document.createElement('span');
            textSpan.innerText = data.text;
            
            msgDiv.appendChild(nameSpan);
            msgDiv.appendChild(textSpan);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
    </script>
</body>
</html>
