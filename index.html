<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperChat</title>
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
    
    <!-- PeerJS for Voice -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>HyperChat</h2>
            <input type="email" id="email" class="auth-input" placeholder="Email">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <button id="email-login-btn" class="auth-btn">Log In / Sign Up</button>
            <p>or</p>
            <button id="google-login-btn" class="auth-btn google-btn">Sign in with Google</button>
        </div>
    </div>

    <!-- CHAT APP SCREEN -->
    <div id="app-container">
        <div id="sidebar">
            <div>
                <div id="brand">HyperChat <button id="logout-btn">Logout</button></div>
                <h3>Channels</h3>
                <p class="active-channel"># general</p>
                <p class="inactive-channel">🔊 voice</p>
            </div>
            
            <!-- FRIENDS LIST -->
            <div class="sidebar-section">
                <h3 style="margin-top: 0;">Friends List</h3>
                <div id="friends-list"></div>
                
                <div class="friend-inputs">
                    <input type="text" id="friend-name-input" placeholder="Friend's Name">
                    <input type="text" id="friend-id-input" placeholder="Their Voice ID">
                    <button id="add-friend-btn">+ Add Friend</button>
                </div>
            </div>

            <!-- USER PROFILE -->
            <div id="user-profile">
                <div class="profile-label">LOGGED IN AS</div>
                <div id="current-username">Loading...</div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="username-input" placeholder="New name...">
                    <button id="save-username-btn">Save</button>
                </div>
            </div>
        </div>

        <div id="main-chat">
            <!-- VOICE PANEL -->
            <div id="voice-panel">
                <span class="voice-id-display">Your Voice ID: <b id="my-peer-id">Loading...</b></span>
                <div style="flex-grow: 1;"></div>
                <input type="text" id="target-peer-id" class="voice-input" placeholder="Paste ID or click a friend">
                <button id="call-btn" class="call-btn">Call</button>
                <button id="hangup-btn" class="hangup-btn">Hang Up</button>
                <audio id="remote-audio" autoplay></audio>
            </div>

            <!-- TEXT CHAT -->
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Message #general" disabled>
                <button id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script type="module" src="app.js"></script>
</body>
</html>
